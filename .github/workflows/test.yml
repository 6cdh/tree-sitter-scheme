name: Test
on:
  push:
    branches:
      - main
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Set up tree sitter
        uses: tree-sitter/setup-action/cli@v1
        with:
          tree-sitter-ref: v0.24.7
      - name: Run tests
        run: tree-sitter test
      - name: Test R5RS dialect
        working-directory: dialects/r5rs
        run: |
          tree-sitter generate
          tree-sitter test
      - name: Test R6RS dialect
        working-directory: dialects/r6rs
        run: |
          node ../../scripts/write-r6rs-line-ending-corpus.js
          tree-sitter generate
          tree-sitter test
      - name: Test R7RS dialect
        working-directory: dialects/r7rs
        run: |
          node ../../scripts/write-r7rs-line-ending-corpus.js
          tree-sitter generate
          tree-sitter test
      - name: Test Chez dialect
        working-directory: dialects/chez
        run: |
          tree-sitter generate
          tree-sitter test
      - name: Test Guile dialect
        working-directory: dialects/guile
        run: |
          node ../../scripts/write-guile-whitespace-corpus.js
          tree-sitter generate
          tree-sitter test

  chez-scheme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up tree sitter
        uses: tree-sitter/setup-action/cli@v1
        with:
          tree-sitter-ref: v0.24.7
      - name: Check out Chez Scheme 10.4.0 tests
        uses: actions/checkout@v4
        with:
          repository: cisco/ChezScheme
          ref: f48b27c4feb7da3ff4858045f6c3f0d4087fa116
          path: .chezscheme
          sparse-checkout: mats
      - name: Build Chez parser
        working-directory: dialects/chez
        run: |
          tree-sitter generate
          tree-sitter build
      - name: Parse Chez Scheme tests
        shell: bash
        run: |
          input_dir="$(mktemp -d)"
          for source_file in .chezscheme/mats/*.ms; do
            cp "$source_file" "$input_dir/$(basename "${source_file%.ms}")_ms.ss"
          done
          for source_file in .chezscheme/mats/*.ss; do
            cp "$source_file" "$input_dir/$(basename "$source_file")"
          done

          cd dialects/chez
          parse_report="$(mktemp)"
          tree-sitter parse --quiet --stat "$input_dir"/*.ss 2>&1 \
            | tee "$parse_report"
          grep -Fq "failed parses: 0;" "$parse_report"

  guile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up tree sitter
        uses: tree-sitter/setup-action/cli@v1
        with:
          tree-sitter-ref: v0.24.7
      - name: Check out Guile 3.0.11 tests
        shell: bash
        run: |
          git init .guile
          git -C .guile remote add origin https://codeberg.org/guile/guile.git
          git -C .guile fetch --depth=1 origin f7e1255dbdcb755b4c8e7e0331384e4668ceb78f
          git -C .guile checkout --detach FETCH_HEAD
      - name: Build Guile parser
        working-directory: dialects/guile
        run: |
          tree-sitter generate
          tree-sitter build
      - name: Parse Guile test sources
        shell: bash
        run: |
          set -o pipefail
          mkdir -p .agent-scratch
          cd dialects/guile
          parse_report="$(mktemp)"
          find ../../.guile/test-suite -type f \
            \( -name guile-test -o -name '*.test' -o -name '*.scm' \
               -o -name '*.ss' -o -name '*.nottest' -o -name '*.sr64' \
               -o -name '*.bench' \) -print0 \
            | sort -z \
            | xargs -0 tree-sitter parse --quiet --stat \
            | tee "$parse_report" ../../.agent-scratch/guile-upstream-parse.log
          grep -Fq "failed parses: 0;" "$parse_report"

  sicp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up tree sitter
        uses: tree-sitter/setup-action/cli@v1
        with:
          tree-sitter-ref: v0.24.7
      - name: Download sicp code
        run: |
          mkdir -p sicp && cd sicp
          curl https://mitp-content-server.mit.edu/books/content/sectbyfn/books_pres_0/6515/sicp.zip/code/allcode.tar.gz -O
          tar xvf allcode.tar.gz
      - run: tree-sitter parse sicp/*.scm -qt
