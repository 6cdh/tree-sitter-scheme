name: Test
on:
  push:
    branches:
      - main
  pull_request:
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      # Lockfile CLI. setup-action/cli@v1 fails on 0.26.13: init-config
      # writes the config path to stderr, so the action's cut of stdout is empty.
      - name: Install npm dependencies
        run: npm ci
      - name: Run tests
        run: npx tree-sitter test
      - name: Test R5RS dialect
        run: node scripts/run-dialect.js r5rs test
      - name: Test R6RS dialect
        run: node scripts/run-dialect.js r6rs test
      - name: Test R7RS dialect
        run: node scripts/run-dialect.js r7rs test
      - name: Test Chez corpus
        run: node scripts/run-dialect.js chez test
      - name: Test Guile corpus
        run: node scripts/run-dialect.js guile test
      - name: Test CHICKEN dialect
        run: node scripts/run-dialect.js chicken test
      - name: Query CHICKEN highlights
        working-directory: dialects/chicken
        run: npx tree-sitter query -q queries/highlights.scm test/corpus/chicken.scm

  chicken-incremental:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install npm dependencies
        run: npm ci
      - name: Test CHICKEN incremental parsing
        run: npm run test:chicken:incremental

  sicp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install npm dependencies
        run: npm ci
      - name: Download sicp code
        run: |
          mkdir -p sicp && cd sicp
          curl https://mitp-content-server.mit.edu/books/content/sectbyfn/books_pres_0/6515/sicp.zip/code/allcode.tar.gz -O
          tar xvf allcode.tar.gz
      - run: npx tree-sitter parse sicp/*.scm -qt
