name: Test
on:
  push:
    branches:
      - main
  pull_request:
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Set up tree sitter
        uses: tree-sitter/setup-action/cli@v1
        with:
          tree-sitter-ref: v0.26.13
      - name: Run tests
        run: tree-sitter test
      - name: Test R5RS dialect
        working-directory: dialects/r5rs
        run: |
          tree-sitter generate
          tree-sitter test
      - name: Test R6RS dialect
        working-directory: dialects/r6rs
        run: |
          node ../../scripts/write-r6rs-line-ending-corpus.js
          tree-sitter generate
          tree-sitter test
      - name: Test R7RS dialect
        working-directory: dialects/r7rs
        run: |
          node ../../scripts/write-r7rs-line-ending-corpus.js
          tree-sitter generate
          tree-sitter test
      - name: Test Chez corpus
        working-directory: dialects/chez
        run: |
          node ../../scripts/write-chez-line-ending-corpus.js
          tree-sitter generate
          tree-sitter test
      - name: Test Guile corpus
        working-directory: dialects/guile
        run: |
          node ../../scripts/write-guile-whitespace-corpus.js
          tree-sitter generate
          tree-sitter test
      - name: Test CHICKEN dialect
        working-directory: dialects/chicken
        run: |
          node ../../scripts/write-chicken-scanner-corpus.js
          tree-sitter generate
          tree-sitter test
          tree-sitter query -q queries/highlights.scm test/corpus/chicken.scm

  chicken-incremental:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install npm dependencies
        run: npm ci
      - name: Test CHICKEN incremental parsing
        run: npm run test:chicken:incremental

  sicp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up tree sitter
        uses: tree-sitter/setup-action/cli@v1
        with:
          tree-sitter-ref: v0.26.13
      - name: Download sicp code
        run: |
          mkdir -p sicp && cd sicp
          curl https://mitp-content-server.mit.edu/books/content/sectbyfn/books_pres_0/6515/sicp.zip/code/allcode.tar.gz -O
          tar xvf allcode.tar.gz
      - run: tree-sitter parse sicp/*.scm -qt
